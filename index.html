<html>
<head>
    <title>おい！</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            background-image: url("audio/731AB66C-2ACC-4F2B-B9A7-B759D24DB3DB.PNG");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative; /* 下部の文字を固定するために必要 */
        }

        h1 {
            color: #ffffff; 
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }

        audio {
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
        }

        /* --- ここから追加：真ん中下の小さい文字用の設定 --- */
        .bottom-text {※背景、一部コードにはAIを使用しています。
            position: absolute;      /* 画面を基準に位置を決める */
            bottom: 20px;            /* 画面の一番下から20px上の位置に固定 */
            left: 50%;               /* 左右の真ん中に持ってくる */
            transform: translateX(-40%); /* 真ん中ピタッとに調整 */
            font-size: 0.8rem;       /* 文字のサイズを小さく（12pxくらい） */
            color: rgba(255, 255, 255, 1); /* 文字の色を少し透明な白にして目立たなくする */
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            white-space: nowrap;     /* スマホで勝手に改行されるのを防ぐ */
        }
        /* ----------------------------------------------- */
    </style>
</head>
<body>

    <h1>貴方はこの未来に何を期待していた</h1>

    <audio controls>
        <source src="audio/anataha.m4a" type="audio/mp4">
    </audio>

    <div class="bottom-text">※背景、一部コードにはAIを使用しています。</div>

</body>
</html>
