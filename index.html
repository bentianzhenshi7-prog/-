<html>
<head>
    <title>おい！</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;

            /* --- 背景画像の設定はここから --- */
            background-image: url("audio/731AB66C-2ACC-4F2B-B9A7-B759D24DB3DB.PNG"); /* 画像のファイル名 */
            background-size: cover;                  /* 画面いっぱいに画像を広げる */
            background-position: center;            /* 画像の中心を画面の真ん中に合わせる */
            background-repeat: no-repeat;           /* 画像を繰り返さない */
            background-attachment: fixed;           /* スクロールしても背景を固定する */
            /* -------------------------------- */
         }

        /* 背景画像と文字が被って見づらい場合は、文字の色を白（#ffffff）などに変更してください */
        h1 {
            color: #ffffff; 
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7); /* 文字の後ろに黒い影を入れて読みやすくします */
        }


        audio {
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>貴方はこの未来に何を期待していた</h1>

    <audio controls>
        <source src="audio/anataha.m4a" type="audio/mp4">
    </audio>

</body>
</html>
